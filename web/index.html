<!DOCTYPE html> <!-- 2026-09-25 -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!--
    Base href computed at runtime from the page's own folder, so the build
    works from any path (e.g. /sitor/) without --base-href. Must run before
    any relative URL below.
  -->
  <script>
    (function () {
      var path = location.pathname;
      var base = document.createElement('base');
      base.setAttribute('href', path.substring(0, path.lastIndexOf('/') + 1));
      document.head.appendChild(base);
    })();
  </script>

  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Website editor">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sitor">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sitor</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #f5f5f5; }
    #sitor-loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font: 18px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: #666;
    }
  </style>
</head>
<body>
  <div id="sitor-loading">Loading editor...</div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('sitor-loading');
      if (el) el.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
